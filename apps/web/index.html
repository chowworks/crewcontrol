<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel HQ</title>
    <meta
      name="description"
      content="Organizer-first group trip planning. Get your trip out the group chat."
    />
    <!-- What a shared link shows (iMessage, WhatsApp, Slack, social apps). Crawlers read only this file, so every
         page shows the same preview. The image's source is scripts/share-image.html; bump ?v= when it changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Travel HQ" />
    <meta property="og:title" content="Travel HQ: Get your trip out the group chat." />
    <meta
      property="og:description"
      content="One link for the plan, one list of who's actually coming, and every payment tracked."
    />
    <meta property="og:url" content="https://travel-hq.app/" />
    <meta property="og:image" content="https://travel-hq.app/share-image.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Travel HQ: Get your trip out the group chat." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Travel HQ: Get your trip out the group chat." />
    <meta
      name="twitter:description"
      content="One link for the plan, one list of who's actually coming, and every payment tracked."
    />
    <meta name="twitter:image" content="https://travel-hq.app/share-image.png?v=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Better Stack's announcement bar: shows at the top of the site while the status page (status.travel-hq.app) has
         an announcement up, and nothing otherwise. -->
    <script
      src="https://incidents.betterstack.com/widgets/announcement.js"
      data-id="269761"
      async
      type="text/javascript"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
