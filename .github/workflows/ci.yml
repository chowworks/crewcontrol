name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deploy at a time; a newer push waits for the one in flight instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run test:scripts

  # Deploys switch on once the Railway project and Vercel project exist: set the repository variable
  # DEPLOY_ENABLED=true and the secrets RAILWAY_TOKEN, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  # RAILWAY_TOKEN is a project token for ONE Railway environment, production, so the config apply and the deploy
  # touch only production, and the repository variable RAILWAY_API_SERVICE names the API service there
  # (crewcontrol-api). Dev is deployed by hand (apps/api/scripts/deploy-dev.sh).
  # The web app goes out after the API it calls, so a new page never reaches guests before its API does.
  deploy-web:
    name: Deploy Web (Vercel)
    needs: [ci, deploy-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npx vercel@63.1.2 deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  railway-config:
    name: Apply Railway config (.railway/railway.ts)
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The railway SDK (root devDependency) evaluates .railway/railway.ts.
      - run: npm install
      - run: npm install -g @railway/cli@5.63.1
      - run: railway config plan --verbose
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # No --confirm-destructive: a plan that deletes anything fails here.
      - run: railway config apply --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-api:
    name: Deploy API (Railway)
    needs: [ci, railway-config]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Railway rebuilds the API only when a file in its watch paths changed (.railway/railway.ts: apps/api/**,
      # packages/types/** and package*.json, gitignore-style, so the last matches at any depth). Keep this list in step
      # with that one. A push that changed one of them uploads and waits for the build (--ci), so a failed build fails
      # this job; any other push uploads nothing, since Railway would build nothing and --ci would wait for a build that
      # never comes. A re-run, or a push whose previous commit is unknown, uploads without waiting.
      - name: Did this push change the API?
        id: api
        run: |
          before='${{ github.event.before }}'
          if [ "${{ github.run_attempt }}" != "1" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "deploy=detach" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(apps/api/|packages/types/)|(^|/)package[^/]*\.json$'; then
            echo "deploy=wait" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=skip" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.api.outputs.deploy != 'skip'
        run: npm install -g @railway/cli@5.63.1
      # Uploads the checked-out tree; Railway builds and starts it (deploy:start runs the migrations and role:ensure).
      - if: steps.api.outputs.deploy == 'wait'
        run: railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - if: steps.api.outputs.deploy == 'detach'
        run: railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Applies ops/monitoring.ts to Better Stack: the monitors, the "Travel HQ" monitor group and this product's section
  # of the shared status page (docs/monitoring.md). Runs after the API deploy, so the health route it watches is live
  # before a monitor checks it. Never deletes anything. Without the BETTERSTACK_API_TOKEN secret the script prints that
  # it skipped and exits 0; nothing depends on this job.
  betterstack:
    name: Sync Better Stack monitoring (ops/monitoring.ts)
    needs: [deploy-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No npm install: the script uses only Node's own modules.
      - run: npm run betterstack:sync
        env:
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
          # CI deploys production only (dev is deployed by hand), so the monitors watch production's API.
          API_URL: https://api.travel-hq.app
